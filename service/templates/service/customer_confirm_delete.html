{% extends 'base.html' %}

{% block title %}
Delete Customer
{% endblock %}

{% block content %}

<h1>Delete Customer</h1>

<p>
    Are you sure you want to delete
    <strong>{{ customer.name }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

    <a href="{% url 'customer_detail' customer.id %}">
        Cancel
    </a>
</form>

{% endblock %}
